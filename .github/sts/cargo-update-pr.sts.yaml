# Only the pinned dependency updater on main may create dependency PRs.
subject:
  - repo:paradigmxyz/revmc:ref:refs/heads/main
  - repo:paradigmxyz@97369466/revmc@769994886:ref:refs/heads/main

claim_pattern:
  repository_id: '769994886'
  event_name: 'workflow_dispatch'
  workflow_ref: 'paradigmxyz/revmc/\.github/workflows/dependencies\.yml@refs/heads/main'
  job_workflow_ref: 'tempoxyz/gh-actions/\.github/workflows/cargo-update-pr\.yml@d5402286a7abdfb7232173b3228d56473feb8a66'

permissions:
  contents: write
  pull_requests: write
